server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://auth.example.com/.well-known/jwks.json
  main:
    allow-bean-definition-overriding: true

blueprints:
  security:
    issuer: "https://decsis-eci/blueprints"
    token-ttl-seconds: 3600
  # Allowed browser origins for REST (CORS) and the STOMP handshake (/ws-blueprints).
  # Dev default is the Vite front. In production this MUST be restricted to the real front-end
  # origin(s); override with env BLUEPRINTS_CORS_ALLOWED_ORIGINS (comma separated).
  cors:
    allowed-origins:
      - http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: blueprints-api
    description: BluePrints REST API + STOMP real-time collaboration

logging:
  level:
    root: INFO
    co.edu.eci.blueprints: INFO
